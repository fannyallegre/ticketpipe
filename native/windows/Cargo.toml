[package]
name = "ticketpipe-controller"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "=1.0.145"
serde = { version = "=1.0.228", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Threading",
  "Win32_Security", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Ole", "Win32_System_Variant",
] }
